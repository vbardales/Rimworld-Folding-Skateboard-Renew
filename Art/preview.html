<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Folding Skateboard Renew — showcase</title>
<style>
html,body { margin:0; padding:0; }
body { width:896px; height:504px; position:relative; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; }
.scene,.veil { position:absolute; inset:0; }
.scene { background:url('Preview.png') 50% 34% / cover no-repeat; }
.veil { background:radial-gradient(circle at 0% 0%,rgb(var(--veilRGB) / .88) 0%,rgb(var(--veilRGB) / 0) 74%); }
.plate { position:absolute; left:50px; top:54px; }
p { margin:0; }
.name,.tag,.line { text-shadow:0 3px 10px rgba(0,0,0,.75); }
.name { width:490px; font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; color:var(--inkPrimary); }
.suffix { font-size:.65em; color:var(--inkSecondary); }
.tag { margin-top:8px; font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; margin-top:20px; background:var(--accent); }
.line { margin-top:16px; width:430px; font-size:21px; font-weight:400; line-height:1.45; letter-spacing:0; color:var(--inkPrimary); }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); color:var(--badgeInk); font-size:26px; font-weight:700; line-height:1; }
.mascot { position:absolute; left:-60px; bottom:-60px; width:240px; height:240px; background:url('mascot.png') no-repeat center/contain; transform:rotate(15deg); filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
</style>
<div class="scene"></div><div class="veil"></div>
<div class="plate"><p class="name">Folding<br>Skateboard <span class="suffix">Renew</span></p>
<p class="tag">(unofficial)</p><div class="rule"></div>
<p class="line">Unfolds on hard ground outdoors, folds onto their back indoors.</p></div>
<div class="badge"></div><p class="version">1.6</p>
<div class="mascot"></div>
<script>
window.previewReady=(async()=>{
 const palette=await (await fetch('preview-palette.json')).json();
 for(const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
 document.documentElement.style.setProperty('--veilRGB',palette.veil.match(/[a-f0-9]{2}/gi).map(x=>parseInt(x,16)).join(' '));
 await document.fonts.ready;
 const picture=new Image(); picture.src='Preview.png'; await picture.decode();
})();
</script></html>
